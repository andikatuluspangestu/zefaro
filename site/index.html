<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zefaro: Yet Another Local Laravel Tools</title>
    <meta
      name="description"
      content="Zefaro is a free, open-source local PHP development environment for Windows. Link a folder and open it at name.test, with PHP, HTTPS, databases and a mail catcher already set up."
    />
    <link rel="canonical" href="https://zefaro.web.id/" />
    <link rel="icon" type="image/svg+xml" href="./zefaro.svg" />
    <meta name="theme-color" content="#FFF7FD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100E1D" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zefaro" />
    <meta property="og:title" content="Zefaro: Yet Another Local Laravel Tools" />
    <meta
      property="og:description"
      content="A free, open-source local PHP development environment for Windows. Link a folder, open name.test."
    />
    <meta property="og:url" content="https://zefaro.web.id/" />
    <meta property="og:image" content="https://zefaro.web.id/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Zefaro",
        "alternateName": "Yet Another Local Laravel Tools",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Windows 10, Windows 11",
        "softwareVersion": "1.0.0",
        "license": "https://opensource.org/license/mit",
        "url": "https://zefaro.web.id/",
        "downloadUrl": "https://github.com/andikatuluspangestu/zefaro/releases/latest",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Theme and language are applied before the first paint, so the page never flashes the wrong ones. -->
    <script>
      try {
        var t = localStorage.getItem("zefaro-site.theme");
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var l =
          localStorage.getItem("zefaro-site.lang") ||
          ((navigator.language || "en").toLowerCase().indexOf("id") === 0 ? "id" : "en");
        document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
