# Builds the Windows installer on GitHub's runners, signs it through SignPath
# (free code signing for open source, certificate by SignPath Foundation), and
# drafts the GitHub release with the installer and SHA256SUMS.txt.
#
# - Pushing a tag vX.Y.Z builds that version and drafts its release.
# - Running it by hand only builds; tick "sign" to sign the test build too.
#
# Signing is skipped until the repository variable SIGNPATH_ORGANIZATION_ID and
# the secret SIGNPATH_API_TOKEN exist; until then the installer is unsigned and
# the job summary says so. See CODE_SIGNING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign this build with SignPath (needs the SignPath variable and secret)
        type: boolean
        default: false

permissions:
  contents: write # draft the release
  actions: read # SignPath reads this job and downloads the unsigned artifact

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Read the version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.value }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version ${{ steps.version.outputs.value }} in package.json"
            exit 1
          fi

      - name: Build the installer
        run: npm run build:installer

      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: src-tauri/target/release/bundle/nsis/Zefaro_${{ steps.version.outputs.value }}_x64-setup.exe
          if-no-files-found: error

      - name: Sign with SignPath
        id: sign
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign)
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'zefaro' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The checksum is taken after signing: signing changes the file, and
      # Zefaro's "Update now" refuses an installer whose SHA-256 doesn't match.
      - name: Collect the release files
        id: files
        shell: pwsh
        run: |
          $name = "Zefaro_${{ steps.version.outputs.value }}_x64-setup.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          if ("${{ steps.sign.outcome }}" -eq "success") {
            Copy-Item "signed/$name" "dist/$name"
            $sig = Get-AuthenticodeSignature "dist/$name"
            if ($sig.Status -ne "Valid") { throw "The signed installer's signature is $($sig.Status): $($sig.StatusMessage)" }
            "signed=true" >> $env:GITHUB_OUTPUT
            "Signed by: $($sig.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Copy-Item "src-tauri/target/release/bundle/nsis/$name" "dist/$name"
            "signed=false" >> $env:GITHUB_OUTPUT
            "**Unsigned build.** Windows SmartScreen will warn about this installer." >> $env:GITHUB_STEP_SUMMARY
          }
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", "$hash *$name`n")
          "SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

      # A draft, so the notes can be written and the files checked before anyone
      # can download them. Its notes start from the version's CHANGELOG section.
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          if ("${{ steps.files.outputs.signed }}" -ne "true") {
            $notes = "> **Unsigned build.** Windows SmartScreen will warn about this installer.`n`n" + $notes
          }
          [IO.File]::WriteAllText("$PWD/notes.md", $notes)
          gh release create "$env:GITHUB_REF_NAME" dist/* --draft --title "Zefaro $version" --notes-file notes.md
