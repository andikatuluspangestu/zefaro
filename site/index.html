<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Replaced per page by scripts/prerender.mjs (title, description, canonical, hreflang, Open Graph, schema.org). -->
    <!--seo:start-->
    <title>Zefaro: free local PHP and Laravel environment for Windows</title>
    <meta name="description" content="Zefaro is a free, open-source local PHP development environment for Windows." />
    <!--seo:end-->
    <meta name="google-site-verification" content="pBY8v8wpllAh3DkLnG1bcSXgz6cbUkBdMo80tvXoK28" />
    <link rel="icon" type="image/svg+xml" href="/zefaro.svg" />
    <link rel="alternate" type="text/markdown" title="Zefaro for language models" href="/llms.txt" />
    <meta name="theme-color" content="#FFF7FD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100E1D" media="(prefers-color-scheme: dark)" />

    <!-- Theme before the first paint. On the English home page, a visitor who chose Indonesian
         (or whose browser is Indonesian, until they choose) goes to /id/. Crawlers keep the page they asked for. -->
    <script>
      try {
        var t = localStorage.getItem("zefaro-site.theme");
        var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var l = localStorage.getItem("zefaro-site.lang");
        var id = l ? l === "id" : (navigator.language || "").toLowerCase().indexOf("id") === 0;
        if (location.pathname === "/" && id && !/bot|crawl|spider|slurp|preview/i.test(navigator.userAgent)) {
          location.replace("/id/" + location.hash);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
